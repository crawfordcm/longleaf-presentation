project:
  type: website
  output-dir: docs
  post-render:
    - touch docs/.nojekyll
  render:
    - index.qmd
    - modules/*.qmd
    - modules/01-introduction/*.qmd
    - modules/03-interacting-with-longleaf/*.qmd
  resources:
    - examples/

website:
  title: "Getting Started with Longleaf"
  description: "A practical introduction to cluster computing, Slurm, and R on Longleaf."
  favicon: images/favicon.svg
  page-navigation: true
  navbar:
    background: "#13294B"
    foreground: "#FFFFFF"
    left:
      - text: "Workshop outline"
        href: index.qmd
    right:
      - icon: github
        href: https://github.com/crawfordcm/longleaf-presentation
        aria-label: "View the source repository"
  sidebar:
    style: floating
    collapse-level: 1
    contents:
      - section: "Workshop modules"
        contents:
          - section: "1 · Introduction to Longleaf"
            contents:
              - text: "1.1 · Computing history at UNC"
                href: modules/01-introduction/01-computing-history.qmd
              - text: "1.2 · Longleaf overview"
                href: modules/01-introduction/02-longleaf-overview.qmd
              - text: "1.3 · How Longleaf works"
                href: modules/01-introduction/03-how-longleaf-works.qmd
          - text: "2 · Accessing Longleaf"
            href: modules/02-accessing-longleaf.qmd
          - section: "3 · Interacting with Longleaf"
            contents:
              - text: "3.1 · Working on Longleaf"
                href: modules/03-interacting-with-longleaf/01-working-on-longleaf.qmd
              - text: "3.2 · Running a Slurm job"
                href: modules/03-interacting-with-longleaf/02-running-a-slurm-job.qmd
              - text: "3.3 · Resources and workflows"
                href: modules/03-interacting-with-longleaf/03-resources-and-workflows.qmd
          - text: "4 · R on Longleaf"
            href: modules/04-r-on-longleaf.qmd
  page-footer:
    left: "Getting Started with Longleaf"
    right: "University of North Carolina at Chapel Hill"

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-title: "On this page"
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true

execute:
  enabled: false
